# Адаптировано из abarichello/godot-ci (MIT), см. third_party/godot-ci.LICENSE
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: Дополнительный прогон
        type: choice
        options: [fast, targeted, full]
        default: targeted
      task:
        description: ID задачи из tasks.json
        type: string

env:
  GODOT_VERSION: 4.7.2

jobs:
  docs:
    name: Проверка документации и очереди
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_runner.py full --stage docs

  test:
    name: Тесты (gdUnit4)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Установка godot-sqlite
        run: |
          if ! command -v curl >/dev/null || ! command -v unzip >/dev/null || ! command -v python3 >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends curl unzip python3
          fi
          sh tools/install_server_sqlite.sh
      - name: Импорт ресурсов
        run: |
          # Первый импорт может вернуть ненулевой код из-за известных предупреждений,
          # поэтому ошибки ищем в журнале: ошибки скриптов и ресурсов роняют шаг.
          godot --headless --path . --import 2>&1 | tee import.log || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|ERROR: .*res://" import.log; then
            echo "Ошибки импорта ресурсов"; exit 1
          fi
      - name: Full — gdUnit4 и офлайн smoke
        run: python3 tools/test_runner.py full --stage game
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports

  export-server:
    name: Сборка сервера (Linux)
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Установка godot-sqlite
        run: |
          if ! command -v curl >/dev/null || ! command -v unzip >/dev/null || ! command -v python3 >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends curl unzip python3
          fi
          sh tools/install_server_sqlite.sh
      - name: Шаблоны экспорта
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Экспорт
        run: |
          mkdir -v -p build/server
          cp third_party/godot-sqlite.LICENSE build/server/
          godot --headless --path . --import
          godot --headless --verbose --export-release "Linux Server" build/server/atlantic-server.x86_64
      - name: Проверка ENet с экспортированным сервером
        run: python3 tools/test_runner.py full --stage network --server ./build/server/atlantic-server.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: build/server

  selected-tests:
    name: Дополнительные проверки по задаче
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    env:
      TEST_MODE: ${{ inputs.mode }}
      TEST_TASK: ${{ inputs.task }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Подготовка инструментов и ресурсов
        run: |
          if ! command -v curl >/dev/null || ! command -v unzip >/dev/null || ! command -v python3 >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends curl unzip python3
          fi
          sh tools/install_server_sqlite.sh
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          godot --headless --path . --import > import.log 2>&1 || true
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load|ERROR: .*res://" import.log; then exit 1; fi
          rm import.log
      - run: python3 tools/test_runner.py "$TEST_MODE" --task "$TEST_TASK"

  export-android:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip apk]'))
    name: Сборка APK (debug)
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Настройка Android
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates ~/.config
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /root/.config/godot ~/.config/godot
          # Отладочный keystore лежит в образе. Релизный ключ подключается через секреты, см. docs/BUILD.md
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> ~/.config/godot/editor_settings-4.7.tres
      - name: Экспорт
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/atlantic-online-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/android
